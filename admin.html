<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins',sans-serif;
}

:root{
  --primary:#3b82f6;
  --primary-dark:#2563eb;
  --success:#22c55e;
  --success-dark:#16a34a;
  --danger:#ef4444;
  --danger-dark:#dc2626;
  --dark-bg:#020617;
  --card-bg:rgba(255,255,255,0.08);
  --card-hover:rgba(255,255,255,0.12);
  --text-primary:#fff;
  --text-secondary:#e0e7ff;
  --border-color:rgba(255,255,255,0.1);
  --shadow:0 10px 40px rgba(0,0,0,0.3);
}

body{
  margin:0;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0c4a6e 100%);
  color:var(--text-primary);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

/* Animated background elements */
body::before,
body::after{
  content:'';
  position:fixed;
  border-radius:50%;
  filter:blur(100px);
  opacity:0.1;
  pointer-events:none;
  animation:float 25s infinite ease-in-out;
}

body::before{
  width:700px;
  height:700px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  top:-250px;
  right:-250px;
}

body::after{
  width:600px;
  height:600px;
  background:linear-gradient(135deg,#06b6d4,#3b82f6);
  bottom:-200px;
  left:-200px;
  animation-delay:-10s;
}

@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(80px,-80px) scale(1.1)}
  66%{transform:translate(-60px,60px) scale(0.9)}
}

/* ===== TOP BAR ===== */
.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(2,6,23,0.95);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 30px rgba(0,0,0,0.5),
             0 0 0 1px rgba(255,255,255,0.05) inset;
  border-bottom:1px solid var(--border-color);
}

.topbar h2{
  margin:0;
  font-size:22px;
  font-weight:700;
  background:linear-gradient(135deg,#fff,#e0e7ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:-0.5px;
}

.logout{
  background:linear-gradient(135deg,var(--danger),var(--danger-dark));
  border:none;
  padding:10px 20px;
  border-radius:12px;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  transition:all 0.3s ease;
  box-shadow:0 4px 15px rgba(239,68,68,0.3);
  font-size:14px;
}

.logout:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(239,68,68,0.4);
}

.logout:active{
  transform:translateY(0);
}

/* ===== PAGE ===== */
.page{
  max-width:1400px;
  margin:0 auto;
  padding:32px 24px;
  position:relative;
  z-index:1;
}

/* ===== SECTION CARDS ===== */
.section-card{
  background:var(--card-bg);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:20px;
  padding:28px;
  margin-bottom:32px;
  box-shadow:var(--shadow),
             0 0 0 1px rgba(255,255,255,0.08) inset;
  animation:fadeUp 0.6s ease backwards;
  transition:all 0.3s ease;
}

.section-card:hover{
  background:var(--card-hover);
  transform:translateY(-2px);
  box-shadow:0 15px 50px rgba(0,0,0,0.4),
             0 0 0 1px rgba(255,255,255,0.1) inset;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.section-card:nth-child(1){animation-delay:0.1s}
.section-card:nth-child(2){animation-delay:0.2s}
.section-card:nth-child(3){animation-delay:0.3s}

/* ===== HEADINGS ===== */
h3{
  margin:0 0 20px 0;
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text-primary);
  letter-spacing:-0.3px;
}

h3::after{
  content:'';
  flex:1;
  height:2px;
  background:linear-gradient(90deg,rgba(59,130,246,0.4),transparent);
  border-radius:2px;
}

/* ===== FILTER GRID ===== */
.filters{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-bottom:20px;
}

.filters select,
.filters input,
.filters button{
  padding:14px 16px;
  border-radius:12px;
  border:1px solid var(--border-color);
  font-size:15px;
  transition:all 0.3s ease;
  font-weight:500;
}

.filters select,
.filters input{
  background:rgba(255,255,255,0.08);
  color:var(--text-primary);
  outline:none;
}

.filters select:focus,
.filters input:focus{
  border-color:var(--primary);
  background:rgba(255,255,255,0.12);
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);
}

.filters select option{
  background:#1e293b;
  color:#fff;
}

.filters input::placeholder{
  color:rgba(255,255,255,0.4);
}

.filters button{
  background:linear-gradient(135deg,var(--success),var(--success-dark));
  color:#fff;
  font-weight:600;
  cursor:pointer;
  border:none;
  box-shadow:0 4px 15px rgba(34,197,94,0.3);
  position:relative;
  overflow:hidden;
}

.filters button::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  transform:translate(-50%,-50%);
  transition:width 0.5s,height 0.5s;
}

.filters button:hover::before{
  width:300px;
  height:300px;
}

.filters button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(34,197,94,0.4);
}

.filters button:active{
  transform:translateY(0);
}

/* ===== TABLE WRAPPER ===== */
.table-wrap{
  background:rgba(255,255,255,0.04);
  border-radius:16px;
  padding:12px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--border-color);
  box-shadow:0 4px 20px rgba(0,0,0,0.2) inset;
}

.table-wrap::-webkit-scrollbar{
  height:10px;
}

.table-wrap::-webkit-scrollbar-track{
  background:rgba(255,255,255,0.05);
  border-radius:10px;
}

.table-wrap::-webkit-scrollbar-thumb{
  background:rgba(59,130,246,0.5);
  border-radius:10px;
}

.table-wrap::-webkit-scrollbar-thumb:hover{
  background:rgba(59,130,246,0.7);
}

/* ===== TABLE ===== */
table{
  width:100%;
  min-width:800px;
  border-collapse:separate;
  border-spacing:0 8px;
}

thead{
  position:sticky;
  top:0;
  z-index:10;
}

th{
  background:linear-gradient(135deg,#1e293b,#0f172a);
  color:var(--text-secondary);
  padding:16px 14px;
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  border:none;
  white-space:nowrap;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

th:first-child{
  border-radius:12px 0 0 12px;
}

th:last-child{
  border-radius:0 12px 12px 0;
}

tbody tr{
  transition:all 0.3s ease;
}

tbody tr:hover{
  transform:translateX(4px);
}

td{
  background:#ffffff;
  color:#1e293b;
  padding:14px;
  text-align:center;
  font-size:14px;
  font-weight:500;
  border:none;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

td:first-child{
  border-radius:12px 0 0 12px;
}

td:last-child{
  border-radius:0 12px 12px 0;
}

/* Attitude table specific styles */
#attTable th:nth-child(2),
#attTable td:nth-child(2){
  min-width:360px;
  max-width:420px;
  text-align:left;
  white-space:nowrap;
}

#attTable td:nth-child(2) input{
  width:100%;
  padding:10px 14px;
  font-size:14px;
  text-align:left;
  border-radius:10px;
  border:1px solid #cbd5e1;
  background:#f8fafc;
  font-weight:500;
  transition:all 0.3s ease;
}

#attTable td:nth-child(2) input:focus{
  outline:none;
  border-color:var(--success);
  box-shadow:0 0 0 3px rgba(34,197,94,0.15);
  background:#fff;
}

/* Inputs inside table */
table input{
  width:90px;
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  text-align:center;
  font-weight:500;
  transition:all 0.3s ease;
}

table input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(59,130,246,0.15);
}

/* Buttons inside table */
table button{
  padding:8px 16px;
  border:none;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}

table button:first-child{
  background:linear-gradient(135deg,var(--success),var(--success-dark));
  color:#fff;
  box-shadow:0 2px 8px rgba(34,197,94,0.3);
}

table button:first-child:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(34,197,94,0.4);
}

table button:last-child{
  background:linear-gradient(135deg,var(--danger),var(--danger-dark));
  color:#fff;
  margin-left:8px;
  box-shadow:0 2px 8px rgba(239,68,68,0.3);
}

table button:last-child:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(239,68,68,0.4);
}

table button:active{
  transform:translateY(0);
}

/* Empty state */
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--text-secondary);
  font-size:15px;
  opacity:0.7;
}

/* ===== MOBILE OPTIMIZATIONS ===== */
@media(max-width:768px){
  .page{
    padding:20px 16px;
  }

  .topbar{
    padding:14px 16px;
  }

  .topbar h2{
    font-size:18px;
  }

  .logout{
    padding:8px 16px;
    font-size:13px;
  }

  .section-card{
    padding:20px;
    margin-bottom:24px;
    border-radius:16px;
  }

  h3{
    font-size:17px;
    margin-bottom:16px;
  }

  .filters{
    gap:10px;
  }

  .filters select,
  .filters input,
  .filters button{
    padding:12px 14px;
    font-size:14px;
  }

  table{
    min-width:1000px;
  }

  #attTable{
    min-width:1100px;
  }

  #attTable th:nth-child(2),
  #attTable td:nth-child(2){
    min-width:380px;
  }

  th{
    padding:12px 10px;
    font-size:12px;
  }

  td{
    padding:10px;
    font-size:13px;
  }
}

/* ===== TABLET & DESKTOP ===== */
@media(min-width:768px){
  .filters{
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  }

  h3{
    font-size:22px;
  }
}

@media(min-width:1024px){
  .page{
    padding:40px 32px;
  }

  .section-card{
    padding:32px;
  }
}

/* ===== LOADING STATE ===== */
.loading{
  pointer-events:none;
  opacity:0.6;
  position:relative;
}

.loading::after{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:20px;
  height:20px;
  margin:-10px 0 0 -10px;
  border:3px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ===== ACCESSIBILITY ===== */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
}

/* Focus visible for keyboard navigation */
*:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <h2>Admin Dashboard</h2>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- PAGE CONTENT -->
<div class="page">

  <!-- REPORT SECTION -->
  <div class="section-card">
    <h3>📊 Report Download</h3>

    <div class="filters">
      <select id="dept"></select>
      <select id="year"></select>
      <select id="section"></select>
      <button onclick="loadReport()">Load Report</button>
      <button onclick="downloadCSV()">Download CSV</button>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <div class="table-wrap">
      <table id="report"></table>
    </div>
  </div>

  <!-- HOD MAIL SECTION -->
  <div class="section-card">
    <h3>📧 Draft HoD Mail</h3>

    <div class="filters">
      <input type="date" id="fromDate">
      <input type="date" id="toDate">
      <button onclick="createHoDDrafts()">Create Draft Mails</button>
    </div>
  </div>

  <!-- ATTITUDE MASTER SECTION -->
  <div class="section-card">
    <h3>🧠 Attitude Master</h3>

    <div class="filters">
      <select id="attType">
        <option value="MIS">BAD</option>
        <option value="GOOD">GOOD</option>
      </select>
      <input id="attName" placeholder="Attitude Name">
      <input id="attMarks" type="number" placeholder="Marks">
      <button onclick="addAttitude()">Add Attitude</button>
    </div>

    <div class="table-wrap">
      <table id="attTable"></table>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>

<script>
  loadFilters();
  loadAttitudeMaster();
</script>

</body>
</html>
