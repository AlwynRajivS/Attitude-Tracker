<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Discipline Monitoring System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Poppins', sans-serif;
}

/* Animated Background */
body.login-body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0c4a6e 100%);
  padding:20px;
  position:relative;
  overflow:hidden;
}

/* Animated background elements */
body.login-body::before,
body.login-body::after{
  content:'';
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.15;
  animation:float 20s infinite ease-in-out;
}

body.login-body::before{
  width:600px;
  height:600px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  top:-200px;
  left:-200px;
  animation-delay:-5s;
}

body.login-body::after{
  width:500px;
  height:500px;
  background:linear-gradient(135deg,#06b6d4,#3b82f6);
  bottom:-150px;
  right:-150px;
}

@keyframes float{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%{transform:translate(50px,-50px) rotate(120deg)}
  66%{transform:translate(-30px,30px) rotate(240deg)}
}

/* Premium Login Card */
.login-card{
  width:100%;
  max-width:440px;
  background:rgba(255,255,255,0.09);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-radius:24px;
  padding:45px 40px;
  text-align:center;
  color:#fff;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),
             0 0 0 1px rgba(255,255,255,0.1) inset;
  animation:fadeUp 0.8s cubic-bezier(0.16,1,0.3,1);
  position:relative;
  z-index:10;
}

/* Shine effect on card */
.login-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:150px;
  background:linear-gradient(180deg,
    rgba(255,255,255,0.15) 0%,
    rgba(255,255,255,0) 100%);
  border-radius:24px 24px 0 0;
  pointer-events:none;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px) scale(0.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

/* Logo Container */
.logo-container{
  width:110px;
  height:110px;
  margin:0 auto 25px;
  background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(139,92,246,0.2));
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 32px rgba(59,130,246,0.3),
             0 0 0 1px rgba(255,255,255,0.1);
  animation:pulse 3s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}

.login-logo{
  width:70px;
  height:70px;
  object-fit:contain;
}

/* Heading */
.login-card h1{
  font-size:28px;
  font-weight:700;
  margin:0 0 8px;
  background:linear-gradient(135deg,#fff,#e0e7ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:-0.5px;
}

.subtext{
  font-size:15px;
  opacity:0.75;
  margin-bottom:35px;
  font-weight:400;
  color:#e0e7ff;
}

/* Input Container */
.input-group{
  position:relative;
  margin-bottom:20px;
  text-align:left;
}

.input-group label{
  display:block;
  font-size:13px;
  font-weight:500;
  margin-bottom:8px;
  color:#e0e7ff;
  padding-left:4px;
}

/* Premium Inputs */
.login-card input{
  width:100%;
  padding:14px 18px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:#fff;
  font-size:15px;
  outline:none;
  transition:all 0.3s ease;
  font-weight:400;
}

.login-card input::placeholder{
  color:rgba(255,255,255,0.4);
}

.login-card input:focus{
  border-color:rgba(59,130,246,0.6);
  background:rgba(255,255,255,0.12);
  box-shadow:0 0 0 4px rgba(59,130,246,0.15),
             0 4px 12px rgba(59,130,246,0.2);
  transform:translateY(-1px);
}

/* Premium Button */
.login-btn{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 4px 15px rgba(59,130,246,0.4);
  position:relative;
  overflow:hidden;
}

.login-btn::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,
    transparent,
    rgba(255,255,255,0.3),
    transparent);
  transition:left 0.5s ease;
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(59,130,246,0.5);
  background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);
}

.login-btn:hover::before{
  left:100%;
}

.login-btn:active{
  transform:translateY(0);
}

/* Footer Text */
.footer-text{
  margin-top:25px;
  font-size:13px;
  opacity:0.6;
  color:#e0e7ff;
}

/* Responsive Design */
@media(max-width:480px){
  .login-card{
    padding:35px 28px;
    max-width:100%;
    border-radius:20px;
  }
  
  .login-card h1{
    font-size:24px;
  }
  
  .logo-container{
    width:90px;
    height:90px;
  }
  
  .login-logo{
    width:55px;
    height:55px;
  }
  
  .subtext{
    font-size:14px;
    margin-bottom:28px;
  }
  
  .login-card input{
    padding:12px 16px;
    font-size:14px;
  }
  
  .login-btn{
    padding:13px;
    font-size:15px;
  }
}

/* Loading State */
.login-btn.loading{
  pointer-events:none;
  opacity:0.7;
}

.login-btn.loading::after{
  content:'';
  position:absolute;
  width:16px;
  height:16px;
  top:50%;
  left:50%;
  margin:-8px 0 0 -8px;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}
</style>
</head>

<body class="login-body">

<div class="login-card">
  <div class="logo-container">
    <img src="Logo.png" class="login-logo" alt="Logo">
  </div>

  <h1>Discipline Monitoring System</h1>
  <p class="subtext">Secure Login Portal</p>

  <div class="input-group">
    <label for="id">User ID / Roll Number</label>
    <input id="id" placeholder="Enter your ID">
  </div>

  <div class="input-group">
    <label for="pass">Password</label>
    <input id="pass" type="password" placeholder="Enter your password">
  </div>

  <button onclick="login()" class="login-btn">Login</button>
  
  <p class="footer-text">Protected by advanced security</p>
</div>

<script src="app.js"></script>

</body>
</html>
